# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration


[changelog]
header = "# Changelog"
footer = "<!-- generated by git-cliff -->"
format = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
sort_commits = "oldest"

commit_preprocessors = [
  { pattern = '^\[Add\]\s*',       replace = "feat: " },
  { pattern = '^\[Change\]\s*',    replace = "change: " },
  { pattern = '^\[Fix\]\s*',       replace = "fix: " },
  { pattern = '^\[Remove\]\s*',    replace = "remove: " },
  { pattern = '^\[Refactor\]\s*',  replace = "refactor: " },
  { pattern = '^\[Docs\]\s*',      replace = "docs: " },
  { pattern = '^\[Test\]\s*',      replace = "test: " },
  { pattern = '^\[Chore\]\s*',     replace = "chore: " },
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/decency131/wuestite/pull/${1}))" },
]

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|test|docs|refactor)", skip = true },
  { message = "^feat",       group = "<!-- 0 -->Added" },
  { message = "^change",     group = "<!-- 1 -->Changed" },
  { message = "^remove",     group = "<!-- 3 -->Removed" },
  { message = "^fix",        group = "<!-- 4 -->Fixed" },
]

[bump]
initial_tag = "v0.1.0"
breaking_always_bump_major = false
features_always_bump_minor = false